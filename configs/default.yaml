# Every value here is hashed into config_hash and stored on every output row.
input_glob: "data/**/*.csv"
out_dir: "runs/latest"
stages: [descriptive, ams, gev, idf, design_storm, runoff, scaling]   # dependencies auto-resolve
workers: 8
resume: true
chunksize: 32
flush_every: 500
plots_sample: 0
seed: 12345

qc:
  valid_min: 0.0                  # < this is a missing sentinel, not a value
  max_plausible_hourly_mm: 250.0
  min_year_completeness: 0.90
  min_window_completeness: 0.90
  require_months: []              # e.g. [5,6,7,8,9] for a wet-season regime

extremes:
  durations_hr: [1, 3, 6, 12, 24, 48, 72]
  return_periods_yr: [2, 5, 10, 25, 50, 100]
  fit_method: lmom                # lmom | mle
  min_years: 15
  xi_bounds: [-0.5, 0.5]

design:
  storm_duration_hr: 24
  design_return_period_yr: 50
  dt_hr: 0.25
  peak_position: 0.5

basin:
  # source: table       -> real catchments, one hydrograph per station
  # source: scenarios   -> no catchments; screen each station against archetypes
  # source: single      -> one basin for every file
  source: single
  table_path: null
  join_key: station_id
  region_fallback: true
  amc: II                         # I dry | II average | III wet
  scenarios:
    - {label: small_pervious, area_km2: 10.0,  cn: 65.0, tc_hr: 1.5}
    - {label: mid_mixed,      area_km2: 50.0,  cn: 75.0, tc_hr: 3.0}
    - {label: large_urban,    area_km2: 150.0, cn: 88.0, tc_hr: 6.0}
  single: {label: default, area_km2: 50.0, cn: 75.0, tc_hr: 3.0}
